<style>
:root{
  --bg:#F6F4EF; --card:#FFFFFF; --ink:#1F2933; --sub:#5B6670; --line:#E3DED4;
  --main:#1F6F5C; --main-ink:#FFFFFF; --main-soft:#E3F1EC;
  --accent:#C2410C; --accent-soft:#FDEBDD;
  --warn:#9A6700; --warn-soft:#FFF4D6;
  --danger:#B42318;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);color-scheme:only light;
  font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation}
input{font:inherit;font-size:18px;color:inherit}

/* ---------- レイアウト ---------- */
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.top{display:flex;align-items:center;gap:8px;padding:12px 16px 4px;min-height:56px}
.back{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:24px;background:var(--card);border:1px solid var(--line)}
.top-title{font-size:16px;font-weight:700;color:var(--sub);flex:1}
.prog{display:flex;gap:6px;padding:4px 16px 0}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--main)}
.body{flex:1;padding:16px 20px 24px;display:flex;flex-direction:column}
.foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;
  position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 75%,rgba(246,244,239,0))}

@media (max-height:740px){.foot.tall{gap:6px;padding-top:8px}.foot.tall .btn{min-height:48px;font-size:16px;padding-top:8px;padding-bottom:8px}.foot.tall .or{margin:0;font-size:12px}}
h1.q{font-size:26px;line-height:1.35;font-weight:800;margin:8px 0 6px;letter-spacing:.01em}
p.hint{color:var(--sub);font-size:16px;margin-bottom:18px}

/* ---------- ボタン ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  min-height:60px;border-radius:var(--r);font-size:19px;font-weight:800;padding:14px 18px}
.btn.main{background:var(--main);color:var(--main-ink);box-shadow:0 6px 16px rgba(31,111,92,.25)}
.btn.main:disabled{background:#B8C4BF;box-shadow:none}
.btn.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink);font-weight:700}
.btn.text{min-height:48px;font-size:16px;font-weight:700;color:var(--sub)}
.btn.danger{color:var(--danger)}
.btn:active{transform:scale(.98)}

.choice{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  background:var(--card);border:2px solid var(--line);border-radius:var(--r);
  padding:18px 18px;min-height:76px;font-size:21px;font-weight:800}
.opt .em{font-size:34px;width:44px;text-align:center;flex:none}
.opt small{display:block;font-size:14px;font-weight:600;color:var(--sub);margin-top:2px}
.opt.on{border-color:var(--main);background:var(--main-soft)}
.opt:active{transform:scale(.98)}

.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;font-size:16px;font-weight:700}
.chip.on{border-color:var(--main);background:var(--main-soft)}

/* ---------- 入力 ---------- */
.field{margin-bottom:18px}
.field label{display:block;font-size:15px;font-weight:700;color:var(--sub);margin-bottom:6px}
.field input{width:100%;height:58px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:0 16px}
.field input:focus{outline:none;border-color:var(--main)}
.field.bad input{border-color:var(--danger)}
.field .err{display:none;color:var(--danger);font-size:14px;font-weight:700;margin-top:4px}
.field.bad .err{display:block}
.field .ex{font-size:13px;color:var(--sub);margin-top:4px}
.money{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);
  border-radius:var(--r);padding:8px 18px;margin-bottom:8px}
.money:focus-within{border-color:var(--main)}
.money span{font-size:28px;font-weight:800;color:var(--sub)}
.money input{flex:1;min-width:0;border:none;outline:none;background:none;font-size:40px;font-weight:800;height:72px;text-align:right}
.money.bad{border-color:var(--danger)}

/* ---------- ホーム ---------- */
.brand{display:flex;align-items:center;justify-content:space-between;padding:22px 20px 4px;min-height:84px}
.brand .wm{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1;color:#1C2A2E;display:flex;align-items:baseline;white-space:nowrap}
.brand .wm .po{display:inline-block;width:.66em;height:.74em;margin:0 .02em;transform:translateY(.07em)}
.brand .tag-line{font-size:13.5px;font-weight:700;color:var(--sub);margin-top:8px;letter-spacing:.02em}
.gear{width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:22px}
.status{margin:16px 20px 0;background:var(--card);border-radius:22px;padding:22px 20px;border:1px solid var(--line)}
.status .lab{font-size:15px;color:var(--sub);font-weight:700}
.status .big{font-size:40px;font-weight:800;line-height:1.2;margin-top:2px}
.status .big small{font-size:20px}
.status .amt{font-size:18px;font-weight:700;color:var(--sub)}
.status.zero .big{color:var(--main)}
.alert{margin:12px 20px 0;border-radius:var(--r);padding:16px 18px;display:flex;gap:12px;align-items:flex-start;text-align:left;width:calc(100% - 40px)}
.alert .em{font-size:26px;line-height:1.2}
.alert b{display:block;font-size:17px}
.alert span{font-size:15px}
.alert.warn{background:var(--warn-soft);color:#5C4100}
.alert.todo{background:var(--accent-soft);color:#6B2508}
.alert.info{background:var(--main-soft);color:#0F3D32}
.big-actions{padding:18px 20px 0;display:flex;flex-direction:column;gap:12px}
.hero{display:flex;align-items:center;gap:16px;width:100%;border-radius:24px;padding:22px 20px;text-align:left;min-height:96px}
.hero .em{font-size:40px}
.hero b{display:block;font-size:22px;font-weight:800}
.hero span{font-size:15px;opacity:.9}
.hero.cam{background:var(--main);color:#fff;box-shadow:0 8px 20px rgba(31,111,92,.28)}
.hero.send{background:var(--card);border:2px solid var(--main);color:var(--ink)}
.hero.send:disabled{border-color:var(--line);color:#9AA3AA}
.hero:active{transform:scale(.98)}
.links{display:flex;flex-direction:column;padding:18px 20px 32px;gap:4px}
.link{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;font-size:17px;font-weight:700;border-bottom:1px solid var(--line);text-align:left;width:100%}
.link:after{content:"›";font-size:24px;color:var(--sub)}

/* ---------- 一覧 ---------- */
.mhead{font-size:15px;font-weight:800;color:var(--sub);margin:18px 0 8px;display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);
  border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;min-height:72px}
.item .ic{font-size:28px;width:36px;text-align:center}
.item .mid{flex:1;min-width:0}
.item .t{display:block;font-size:17px;font-weight:800}
.item .s{display:block;font-size:14px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{text-align:right;font-weight:800;font-size:17px;white-space:nowrap}
.item .tag{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:2px 8px;margin-top:2px}
.tag.done{background:var(--main-soft);color:var(--main)}
.tag.todo{background:var(--accent-soft);color:var(--accent)}
.tag.old{background:var(--warn-soft);color:var(--warn)}
.item.sel .box{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex:none}
.item.sel.on{border-color:var(--main);background:var(--main-soft)}
.item.sel.on .box{background:var(--main);border-color:var(--main)}
.item.sel.on.del{border-color:var(--danger);background:#FDE8E4}
.item.sel.on.del .box{background:var(--danger);border-color:var(--danger)}
.empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:17px}

/* ---------- 確認カード ---------- */
.sum{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;margin-bottom:16px}
.sum .row{display:flex;align-items:center;gap:12px;padding:16px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.sum .row:last-child{border-bottom:none}
.sum .k{font-size:14px;color:var(--sub);font-weight:700;width:68px;flex:none}
.sum .v{flex:1;font-size:19px;font-weight:800;min-width:0;word-break:break-all}
.sum .ed{font-size:14px;color:var(--main);font-weight:800}
.photo{width:100%;max-height:34vh;object-fit:contain;border-radius:14px;background:#fff;border:1px solid var(--line);margin-bottom:14px}
.pdfmark{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;font-weight:700}
.pdfmark .em{font-size:30px}

/* ---------- 申請ステップ ---------- */
.steps{display:flex;flex-direction:column;gap:14px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.step .n{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;font-weight:800;align-items:center;justify-content:center;margin-right:8px}
.step.off{opacity:.45}
.step.done .n{background:var(--ok,#2E7D4F)}
.step .btn{margin-top:10px}
.step h3{font-size:19px;font-weight:800;display:flex;align-items:center;margin-bottom:8px}
.step p{font-size:15px;color:var(--sub);margin-bottom:12px}
.copyline{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.copyline code{flex:1;font-family:inherit;font-weight:800;font-size:16px;overflow-wrap:anywhere}
.copyline button{background:var(--main-soft);color:var(--main);font-weight:800;border-radius:10px;padding:8px 12px;font-size:15px;white-space:nowrap}
.done-mark{font-size:72px;text-align:center;margin:30px 0 10px}

.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.cal-head b{font-size:20px;font-weight:800}
.cal-nav{width:48px;height:48px;border-radius:50%;font-size:28px;font-weight:700;color:var(--main);background:var(--main-soft)}
.cal-nav:disabled{opacity:.25}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-w{font-size:13px;font-weight:700;color:var(--sub);padding:4px 0}
.cal-d{height:46px;border-radius:12px;font-size:18px;font-weight:700}
.cal-d:disabled{color:#C9CDD0}
.sun{color:#B42318}.sat{color:#1D4ED8}
.cal-d.sun:disabled,.cal-d.sat:disabled{color:#C9CDD0}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--line)}
.cal-d.on{background:var(--main);color:#fff;box-shadow:none}

.help{margin-top:22px;padding:14px 16px;border-radius:14px;background:rgba(0,0,0,.03);color:var(--sub);font-size:14px;line-height:1.6}
.help-t{font-weight:800;color:var(--ink);font-size:14px;margin-bottom:6px}
.help ol{padding-left:1.3em;margin:0 0 6px}
.help li{margin-bottom:4px}
.help p{font-size:13px;margin:0}
.condlist{display:flex;flex-direction:column;gap:8px}
.condrow{display:flex;align-items:stretch;background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.condrow.on{border-color:var(--main);background:var(--main-soft)}
.condpick{flex:1;text-align:left;padding:14px 16px;font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.condpick small{font-size:12px;font-weight:700;color:var(--sub);background:var(--bg);border-radius:6px;padding:2px 8px}
.condx{width:48px;color:#A0A8AE;font-size:15px;border-left:1px solid var(--line)}
.sec{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;margin:18px 0 8px}
.sec .n{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;font-size:16px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.pdfthumb{display:block;width:100%;padding:0;border:0;background:none;text-align:center;position:relative;margin-bottom:6px}
.pdfthumb .pdfprev{max-height:380px;overflow:hidden;margin:0;position:relative}
.pdfthumb .cap{display:block;margin-top:-44px;position:relative;padding:12px;font-size:15px;font-weight:800;color:var(--main);background:linear-gradient(to top,rgba(255,255,255,.97) 70%,rgba(255,255,255,0));border-radius:0 0 var(--r) var(--r)}
.fixbox{background:var(--main-soft);border:1.5px solid var(--main);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:16px;font-weight:800;color:var(--ink)}
.fixbox small{font-size:13px;font-weight:600;color:var(--sub)}
.redo{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);text-align:center}
.redo p{font-size:14px;color:var(--sub);margin:0}
.pdfprev{background:#E9E6DF;border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;align-items:center;min-height:200px;margin-bottom:8px}
.pdfprev canvas{max-width:100%;height:auto;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pdfprev .vmsg{color:var(--sub);font-weight:700;padding:60px 10px;text-align:center}
.linkbtn{display:block;font-size:15px;font-weight:700;padding:4px 0 12px;color:var(--main)}
.linkbtn.danger{color:var(--danger)}
.btn.ghost.danger{color:var(--danger)}
.choose{font-size:14px;font-weight:800;color:var(--sub);text-align:center;margin-bottom:-2px}
.nw{display:inline-block;white-space:nowrap}
.or{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:var(--sub);margin:-4px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.sizebar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:4px 0 12px;font-size:15px;color:var(--sub);font-weight:700}
.sizebar b{color:var(--ink);font-size:17px}
.sizebar.over{background:var(--warn-soft);border-color:#F0D58A}
/* ---------- 署名 ---------- */
.sig{position:relative;background:#fff;border:2px dashed var(--line);border-radius:var(--r);height:180px}
.sig canvas{width:100%;height:100%;display:block;touch-action:none}
.sig .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#A8B0B6;font-size:18px;font-weight:700;pointer-events:none}

/* ---------- 設定一覧 ---------- */
.setlist{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.setlist button{display:flex;align-items:center;gap:12px;width:100%;padding:18px 16px;text-align:left;border-bottom:1px solid var(--line)}
.setlist button:last-child{border-bottom:none}
.setlist .em{font-size:24px}
.setlist .t{flex:1;font-weight:800}
.setlist .t small{display:block;font-weight:600;color:var(--sub);font-size:14px}
.setlist .ok{color:var(--main);font-weight:800;font-size:14px}
.setlist .ng{color:var(--accent);font-weight:800;font-size:14px}
.member{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:19px;font-weight:800}
.member button{color:var(--danger);font-size:15px;font-weight:700;padding:6px 10px}
.addrow{display:flex;gap:10px}
.addrow input{flex:1;height:58px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:0 16px;min-width:0}
.addrow button{background:var(--main);color:#fff;border-radius:14px;padding:0 20px;font-weight:800}

/* ---------- その他 ---------- */
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:#1F2933;color:#fff;font-weight:700;padding:14px 20px;border-radius:14px;opacity:0;pointer-events:none;
  transition:.25s;z-index:1000;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{position:fixed;inset:0;background:rgba(246,244,239,.92);z-index:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-weight:800;font-size:18px}
.spin{width:48px;height:48px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--main);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.viewer{position:fixed;inset:0;background:#000;z-index:950;display:flex;flex-direction:column}
.viewer-bar{padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 6px;display:flex;justify-content:flex-end;background:#000}
.viewer-bar button{color:#000;background:#fff;font-size:18px;font-weight:800;padding:12px 20px;border-radius:999px}
.viewer-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 8px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:center}
.viewer-body img,.viewer-body canvas{max-width:100%;height:auto;background:#fff}
.viewer-body iframe{width:100%;flex:1;border:0;background:#fff;min-height:80vh}
.viewer-body .vmsg{color:#fff;font-weight:700;padding:30px;text-align:center}
.note{font-size:14px;color:var(--sub);text-align:center;margin-top:6px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;padding:4px 2px}
.total b{font-size:26px}
</style>
</head>
<body>
<div class="app" id="app"></div>

<input type="file" id="fileCam" accept="image/*" capture="environment" hidden/>
<input type="file" id="filePhoto" accept="image/*" hidden/>
<input type="file" id="filePdf" accept="application/pdf,.pdf" hidden/>

<div class="loading" id="loading" hidden><div class="spin"></div><div id="loadingText">少々お待ちください</div><button type="button" id="loadingSkip" class="btn ghost" style="width:auto;min-height:48px;font-size:16px" hidden>スキップして自分で入力</button></div>
<div class="viewer" id="viewer" hidden><div class="viewer-bar"><button type="button" id="viewerClose">✕ 閉じる</button></div><div class="viewer-body" id="viewerBody"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
(function(){
"use strict";
/* ========================================================
   Claim Pocket v2 — 1画面1質問のシンプル版
   ・保存データ(IndexedDB "claim_pocket_v1" / localStorage)は旧版と互換
   ======================================================== */
var PROFILE_KEY="claim_pocket_profile_v1";
var DB_NAME="claim_pocket_v1";
var DEFAULT_INSURER_EMAIL="jpclaims@gbtpa.com.au";
var POLICY_PREFIX="MEDIPACK0802/";
var DEFAULT_BANK="ANZ", DEFAULT_BRANCH="SOUTH MELBOURNE"; // 基本情報の初期値(書きかえ可)
var CLAIM_ROW_MAX=10;
var MEMBER_MAX=10;
var DEADLINE_DAYS=90, WARN_DAYS=60;

var CATS={
  M:{em:"🏥",name:"病院・クリニック",sub:"診察・検査・治療など",form:"M.一般医療費"},
  P:{em:"💊",name:"薬局のお薬",sub:"処方せんのお薬",form:"P.処方薬"},
  D:{em:"🦷",name:"歯医者",sub:"歯の治療・マウスピースなど",form:"D.歯科"}
};

/* ---------- 小物 ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad2(n){return String(n).padStart(2,"0");}
function isoOf(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function todayIso(){return isoOf(new Date());}
function yesterdayIso(){var d=new Date();d.setDate(d.getDate()-1);return isoOf(d);}
function dmyAu(sep){var d=new Date(),s=sep||"/";return pad2(d.getDate())+s+pad2(d.getMonth()+1)+s+d.getFullYear();}
function isoToAu(iso){if(!iso)return"";var p=String(iso).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:String(iso);}
function jpDate(iso){if(!iso)return"";var p=String(iso).split("-");return Number(p[1])+"月"+Number(p[2])+"日";}
function monthKey(iso){return String(iso||"").slice(0,7);}
function monthLabel(k){var p=String(k||"").split("-");return p.length===2?Number(p[0])+"年"+Number(p[1])+"月":k;}
function daysSince(iso){var p=String(iso||"").split("-");if(p.length!==3)return 0;var d=new Date(+p[0],+p[1]-1,+p[2]);var t=new Date();t.setHours(0,0,0,0);return Math.round((t-d)/86400000);}
function z2h(v){return String(v||"").replace(/[！-～]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248);}).replace(/　/g," ");}
function upAscii(v){return z2h(v).toUpperCase();}
function digOnly(v,max){var o=z2h(v).replace(/[^0-9]/g,"");return typeof max==="number"?o.slice(0,max):o;}
function isEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||"").trim());}
function uid(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);}
function normCur(v){return String(v||"AUD").toUpperCase()==="JPY"?"JPY":"AUD";}
function curDigits(c){return normCur(c)==="JPY"?0:2;}
function curMark(c){return normCur(c)==="JPY"?"¥":"$";}
function parseAmt(v,c){var t=z2h(v).replace(/\s/g,"");if(/^[^0-9]*\d+,\d{1,2}$/.test(t))t=t.replace(",",".");var n=parseFloat(t.replace(/,/g,"").replace(/[^0-9.\-]/g,""));if(!isFinite(n))return 0;return curDigits(c)===0?Math.round(n):Math.round(n*100)/100;}
function fmtAmt(v,c){var n=typeof v==="number"?v:parseAmt(v,c);return n.toLocaleString("en-AU",{minimumFractionDigits:curDigits(c),maximumFractionDigits:curDigits(c)});}
function fmtMoney(v,c){return (normCur(c)==="JPY"?"¥":"A$")+" "+fmtAmt(v,c);}
function cur(){return normCur(profile.currency);}

var toastTimer=0;
function toast(m){var el=$("toast");el.textContent=m;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove("show");},2600);}
function showLoading(t){$("loadingText").textContent=t||"少々お待ちください";$("loading").hidden=false;}
function hideLoading(){$("loading").hidden=true;}

/* ---------- IndexedDB(旧版と同じ構造) ---------- */
var dbPromise=null;
function openDb(){
  if(dbPromise)return dbPromise;
  dbPromise=new Promise(function(res,rej){
    var r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=function(e){var db=e.target.result;
      if(!db.objectStoreNames.contains("receipts"))db.createObjectStore("receipts",{keyPath:"id"});
      if(!db.objectStoreNames.contains("claims"))db.createObjectStore("claims",{keyPath:"id"});};
    r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};
  });
  return dbPromise;
}
function dbOp(store,mode,fn){return openDb().then(function(db){return new Promise(function(res,rej){var tx=db.transaction(store,mode);fn(tx.objectStore(store));tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};});});}
function dbPut(s,v){return dbOp(s,"readwrite",function(st){st.put(v);});}
function dbDel(s,k){return dbOp(s,"readwrite",function(st){st.delete(k);});}
function dbAll(s){return openDb().then(function(db){return new Promise(function(res,rej){var r=db.transaction(s,"readonly").objectStore(s).getAll();r.onsuccess=function(){res(r.result||[]);};r.onerror=function(){rej(r.error);};});});}

/* ---------- 状態 ---------- */
var receipts=[],claims=[];
var profile=loadProfile();
function loadProfile(){
  var p=null;
  try{var raw=localStorage.getItem(PROFILE_KEY);if(raw)p=JSON.parse(raw);}catch(e){}
  p=p||{};
  var def={name:"",policyNo:POLICY_PREFIX,phone:"",email:"",employer:"",address:"",bank:"",branch:"",bsb:"",accNo:"",accName:"",members:[],currency:"AUD",signature:"",insurerEmail:DEFAULT_INSURER_EMAIL};
  Object.keys(def).forEach(function(k){if(p[k]==null)p[k]=def[k];});
  return p;
}
function saveProfile(){try{localStorage.setItem(PROFILE_KEY,JSON.stringify(profile));}catch(e){toast("保存できませんでした");}}
function members(){return profile.members||[];}
function insurerEmail(){return isEmail(profile.insurerEmail)?profile.insurerEmail:DEFAULT_INSURER_EMAIL;}
function policySuffix(){return String(profile.policyNo||"").replace(POLICY_PREFIX,"");}
var setupChecks={
  you:function(){return !!(profile.name&&policySuffix()&&profile.employer);},
  contact:function(){return !!(profile.phone&&isEmail(profile.email)&&profile.address);},
  bank:function(){return !!(profile.bank&&profile.branch&&/^\d{6}$/.test(profile.bsb||"")&&profile.accNo&&profile.accName);},
  family:function(){return members().length>0;},
  sign:function(){return !!profile.signature;}
};
function profileReady(){return Object.keys(setupChecks).every(function(k){return setupChecks[k]();});}

function unclaimed(){return receipts.filter(function(r){return !r.claimedAt;});}
function drafts(){return claims.filter(function(c){return c.status==="draft";});}
function inDraftIds(){var s={};drafts().forEach(function(c){(c.receiptIds||[]).forEach(function(id){s[id]=true;});});return s;}
function selectable(){var d=inDraftIds();return unclaimed().filter(function(r){return !d[r.id];}).sort(function(a,b){return a.date<b.date?-1:1;});}
function sumOf(list){return list.reduce(function(s,r){return s+parseAmt(r.amount,cur());},0);}

/* ---------- 画面切り替え(簡易ルーター) ---------- */
var stack=[];          // 戻る用の履歴
var cur_screen=null;
function go(name,arg,opts){
  opts=opts||{};
  if(cur_screen&&!opts.replace) stack.push(cur_screen);
  if(opts.reset) stack=[];
  cur_screen={name:name,arg:arg};
  render();
}
function back(){
  var prev=stack.pop();
  if(!prev){cur_screen={name:"home"};}else cur_screen=prev;
  render();
}
function home(){stack=[];cur_screen={name:"home"};render();}
/* 端末の「戻る」: アプリ内で1つ前の画面へ。ホームでもう一度押すとアプリを閉じる */
var HIST=!!(window.history&&history.pushState);
function armBack(){if(HIST&&!(history.state&&history.state.cp)){try{history.pushState({cp:1},"");}catch(e){}}}
window.addEventListener("popstate",function(){
  if(!$("loading").hidden){armBack();return;}                 // 処理中は無視
  if(!$("viewer").hidden){closeViewer();armBack();return;}     // PDF・写真の表示を閉じる
  var n=cur_screen?cur_screen.name:"home";
  if(n==="home"&&!stack.length)return;                         // ホーム → 端末の動作にまかせる
  if(n==="list"&&delSel){delSel=null;render();return;}
  if(n==="recDone"||n==="claimDone"||(n==="setup"&&cur_screen.arg==="done")){act("home");return;}
  act("back");
});
function render(){
  var s=cur_screen||{name:"home"};
  var fn=SCREENS[s.name]||SCREENS.home;
  $("app").innerHTML=fn(s.arg);
  window.scrollTo(0,0);
  if(AFTER[s.name])AFTER[s.name](s.arg);
  if(s.name==="home"&&!stack.length){if(HIST&&history.state&&history.state.cp){try{history.back();}catch(e){}}}
  else armBack();
}
function topBar(title,progress){
  var h='<div class="top"><button class="back" type="button" data-act="back" aria-label="もどる">‹</button><div class="top-title">'+esc(title||"")+'</div></div>';
  if(progress){h+='<div class="prog">';for(var i=1;i<=progress[1];i++)h+='<i class="'+(i<=progress[0]?"on":"")+'"></i>';h+='</div>';}
  return h;
}

/* ---------- 保存データの大きさ ---------- */
var STORAGE_WARN_MB=20; // これを超えたら、削除をおすすめする
function dataBytes(){
  var n=0;
  receipts.forEach(function(r){n+=(r.blob&&r.blob.size)||0;if(r.thumb)n+=Math.round(r.thumb.length*0.75);});
  claims.forEach(function(c){n+=(c.pdfBlob&&c.pdfBlob.size)||0;});
  return n;
}
function fmtMB(b){var mb=b/1048576;return mb<0.1?"0.1MB未満":(mb<10?mb.toFixed(1):Math.round(mb))+"MB";}

/* 途中の申請書に入っているレシートを直す/消すときは、古い申請書を消す */
function draftsWith(id){return drafts().filter(function(c){return (c.receiptIds||[]).indexOf(id)>=0;});}
async function dropDraftsWith(id){
  var ds=draftsWith(id);
  for(var i=0;i<ds.length;i++)await dbDel("claims",ds[i].id);
  var gone={};ds.forEach(function(c){gone[c.id]=1;});
  claims=claims.filter(function(c){return !gone[c.id];});
  return ds.length;
}
/* ---------- 共通: 1件分の表示 ---------- */
function itemHtml(r,mode){
  var c=CATS[r.category]||{em:"📄",name:""};
  var right='<div class="r">'+esc(fmtMoney(r.amount,cur()))+'</div>';
  var tag="";
  if(mode==="list"){
    if(r.claimedAt)tag='<span class="tag done">申請書作成済み</span>';
    else if(badFiles[r.id])tag='<span class="tag todo" style="background:#FDE8E4;color:#B42318">要差し替え</span>';
    else if(daysSince(r.date)>=WARN_DAYS)tag='<span class="tag old">はやめに申請</span>';
    else tag='<span class="tag todo">申請書まだ</span>';
    right='<div class="r">'+esc(fmtMoney(r.amount,cur()))+'<br>'+tag+'</div>';
  }
  if(mode==="sel"&&r.claimedAt)right='<div class="r">'+esc(fmtMoney(r.amount,cur()))+'<br><span class="tag done">申請書作成済み</span></div>';
  return (mode==="sel"?'<span class="box">✓</span>':'')+
    '<span class="ic">'+c.em+'</span>'+
    '<span class="mid"><span class="t">'+esc(r.person||"?")+'</span>'+
    '<span class="s">'+(r.fileType==="pdf"?'📧 ':'')+esc(jpDate(r.date))+' ・ '+esc(c.name)+(r.condition?' ・ '+esc(r.condition):'')+'</span></span>'+right;
}

/* ========================================================
   画面定義
   ======================================================== */
var SCREENS={},AFTER={};
var LOGO_SVG='<svg class="po" viewBox="0 0 24 27" aria-hidden="true"><rect x="6" y="0" width="12" height="13" rx="2" fill="#E9B872"/><path d="M1 9h22v6c0 6.6-4.9 12-11 12S1 21.6 1 15z" fill="#1E4D45"/></svg>';

/* ---------- ホーム ---------- */
var fixHint=null;
function fixBox(t){return '<div class="fixbox">✏️ '+t+'<br><small>直したら、ホームの「申請書を作成する」からもう一度作ってください。</small></div>';}
SCREENS.home=function(){
  fixHint=null;
  var ready=profileReady();
  var list=unclaimed(), sel=selectable(), ds=drafts();
  var h='<div class="brand"><div><div class="wm" role="img" aria-label="Claim Pocket">Claim&nbsp;P'+LOGO_SVG+'cket</div><div class="tag-line">医療費の保険申請を、かんたんに</div></div>'+(ready?'<button class="gear" type="button" data-act="settings" aria-label="設定">⚙️</button>':'')+'</div>';

  // 1) 基本情報が未登録 → 登録ボタンだけ
  if(!ready){
    h+='<div class="big-actions" style="padding-top:28px">';
    h+='<button class="hero cam" type="button" data-act="setup"><span class="em">📝</span><span><b>基本情報を登録する</b><span>最初の1回だけ・5分ほど</span></span></button>';
    h+='</div>';
    return h;
  }

  // お知らせ(送信待ち・期限)
  if(ds.length===1){
    h+='<button class="alert todo" type="button" data-act="resume" data-id="'+esc(ds[0].id)+'"><span class="em">📨</span><span><b>途中の申請書があります</b><span>'+ds[0].receiptIds.length+'件・'+esc(ds[0].totalText||"")+' → タップして保存・削除</span></span></button>';
  }else if(ds.length>1){
    h+='<button class="alert todo" type="button" data-act="drafts"><span class="em">📨</span><span><b>途中の申請書が'+ds.length+'件あります</b><span>タップして、保存するか削除してください</span></span></button>';
  }
  var bytes=dataBytes(),nDoneAll=receipts.filter(function(r){return r.claimedAt;}).length;
  if(bytes>STORAGE_WARN_MB*1048576&&nDoneAll){
    h+='<button class="alert warn" type="button" data-act="cleanup"><span class="em">🧹</span><span><b>保存データが大きくなってきました（'+fmtMB(bytes)+'）</b><span>申請書を作成済みのレシート（'+nDoneAll+'件）を、そろそろ削除しましょう → タップ</span></span></button>';
  }
  var bads=list.filter(function(r){return badFiles[r.id];});
  if(bads.length){
    h+='<button class="alert todo" type="button" data-act="openRec" data-id="'+esc(bads[0].id)+'" style="background:#FDE8E4;color:#7A1C10"><span class="em">⚠️</span><span><b>差し替えが必要なレシートがあります（'+bads.length+'件）</b><span>'+esc(bads[0].person)+'・'+esc(jpDate(bads[0].date))+'・'+esc(fmtMoney(bads[0].amount,cur()))+' → タップして写真に差し替え</span></span></button>';
  }
  var oldest=list.reduce(function(m,r){return Math.max(m,daysSince(r.date));},0);
  if(list.length&&oldest>=WARN_DAYS){
    h+='<div class="alert warn"><span class="em">⏰</span><span><b>受診から'+oldest+'日たったレシートがあります</b><span>申請は受診から'+DEADLINE_DAYS+'日以内が目安です</span></span></div>';
  }

  // 2) 登録済み → レシートを記録する
  h+='<div class="big-actions" style="padding-top:'+(ds.length||(list.length&&oldest>=WARN_DAYS)?'18':'28')+'px">';
  h+='<button class="hero cam" type="button" data-act="rec"><span class="em">📷</span><span><b>レシートを記録する</b><span>紙のレシートも、メールで届いたレシートも</span></span></button>';

  // 3) レシートが1件以上 → 申請書を作成する
  if(receipts.length){
    var sub=sel.length?'申請書がまだのレシート '+sel.length+'件・'+esc(fmtMoney(sumOf(sel),cur()))
      :(ds.length?'上のお知らせから続けてください':'申請書がまだのレシートはありません');
    h+='<button class="hero send" type="button" data-act="claim"'+(sel.length?'':' disabled')+'><span class="em">✉️</span><span><b>申請書を作成する</b><span>'+sub+'</span></span></button>';
  }
  h+='</div>';

  if(receipts.length){
    h+='<div class="links">';
    h+='<button class="link" type="button" data-act="list">記録したレシートを見る（'+receipts.length+'件）</button>';
    h+='</div>';
  }
  return h;
};

function condHist(){return Array.isArray(profile.condHistory)?profile.condHistory:[];}
function rememberCond(t,person){
  t=String(t||"").trim();if(!t)return;
  var h=condHist().filter(function(x){return x.t.toLowerCase()!==t.toLowerCase();});
  h.unshift({t:t,p:person||"",at:Date.now()});
  profile.condHistory=h.slice(0,30);saveProfile();
}
function seedCondHistory(){
  if(Array.isArray(profile.condHistory))return;
  if(!receipts.some(function(r){return r.condition;}))return; // 記録がなければ何もしない
  var list=receipts.filter(function(r){return r.condition;}).sort(function(a,b){return a.date<b.date?1:-1;});
  var seen={},h=[];
  list.forEach(function(r){var k=r.condition.trim().toLowerCase();if(!k||seen[k])return;seen[k]=1;h.push({t:r.condition.trim(),p:r.person,at:0});});
  profile.condHistory=h.slice(0,30);saveProfile();
}
SCREENS.recCond=function(){
  // その人が前に入力したもの → ほかの人のもの、の順
  var hist=condHist();
  var mine=hist.filter(function(x){return x.p===rec.person;}),others=hist.filter(function(x){return x.p!==rec.person;});
  var opts=mine.concat(others).slice(0,10);

  if(opts.length){

var pickedDate="";   // カレンダーで選んだ日(決定ボタンを押すまで仮)
var calMonth="";     // 表示中の月 "YYYY-MM"
function jpDateW(iso){var p=String(iso).split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);return jpDate(iso)+"（"+"日月火水木金土"[d.getDay()]+"）";}
function addMonth(ym,n){var p=ym.split("-");var d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+"-"+pad2(d.getMonth()+1);}
function calHtml(){
  var t=todayIso(),thisM=t.slice(0,7),minM=addMonth(thisM,-12);
  var p=calMonth.split("-"),y=+p[0],m=+p[1];
  var first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();
  var h='<div class="cal"><div class="cal-head">'+
    '<button type="button" class="cal-nav" data-act="calMove" data-v="-1"'+(calMonth<=minM?' disabled':'')+' aria-label="前の月">‹</button>'+
    '<b>'+y+'年'+m+'月</b>'+
    '<button type="button" class="cal-nav" data-act="calMove" data-v="1"'+(calMonth>=thisM?' disabled':'')+' aria-label="次の月">›</button></div>';
  h+='<div class="cal-grid">';
  "日月火水木金土".split("").forEach(function(w,i){h+='<span class="cal-w'+(i===0?' sun':i===6?' sat':'')+'">'+w+'</span>';});
  for(var i=0;i<first;i++)h+='<span></span>';
  for(var d=1;d<=days;d++){
    var iso=y+"-"+pad2(m)+"-"+pad2(d),dow=(first+d-1)%7;
    var cls="cal-d"+(iso===pickedDate?" on":"")+(iso===t?" today":"")+(dow===0?" sun":dow===6?" sat":"");
    h+='<button type="button" class="'+cls+'" data-act="calPick" data-v="'+iso+'"'+(iso>t?' disabled':'')+'>'+d+'</button>';
  }
  return h+'</div></div>';
}

      (delCount()?'<button class="chip" type="button" data-act="delPick" data-v="none">選択を解除</button>':'')+'</div>';
  }
  var map={};receipts.forEach(function(r){var k=monthKey(r.date)||"不明";(map[k]=map[k]||[]).push(r);});
  Object.keys(map).sort().reverse().forEach(function(k){

           :'<span>'+esc(fmtMoney(sumOf(items),cur()))+'</span>')+'</div>';

      if(mode){

        h+='<button class="item sel'+(on?' on del':'')+'" type="button" data-act="delToggle" data-id="'+esc(r.id)+'">'+itemHtml(r,"sel")+'</button>';
      }else h+='<button class="item" type="button" data-act="openRec" data-id="'+esc(r.id)+'">'+itemHtml(r,"list")+'</button>';
    });
  });
  h+='</div>';
  if(mode){var n=delCount();
    h+='<div class="foot"><button class="btn main" type="button" data-act="delRun" style="background:var(--danger);box-shadow:none"'+(n?'':' disabled')+'>🗑 '+(n?n+'件を削除':'削除するレシートを選んでください')+'</button></div>';}

};
async function deleteSelected(){
  var ids=Object.keys(delSel).filter(function(k){return delSel[k];});
  if(!ids.length)return;
  var set={};ids.forEach(function(i){set[i]=1;});
  var hitDrafts=drafts().filter(function(c){return (c.receiptIds||[]).some(function(id){return set[id];});});
  var msg=ids.length+"件のレシートを削除します。\n削除すると元に戻せません。";
  if(hitDrafts.length)msg+="\n\n※途中の申請書に入っているレシートが含まれるため、その申請書("+hitDrafts.length+"件)も消えます。";
  if(!confirm(msg))return;
  showLoading("削除しています");
  try{
    for(var i=0;i<ids.length;i++)await dbDel("receipts",ids[i]);
    for(var j=0;j<hitDrafts.length;j++)await dbDel("claims",hitDrafts[j].id);
  }catch(e){hideLoading();alert("削除できませんでした。もう一度お試しください。");return;}
  receipts=receipts.filter(function(r){return !set[r.id];});
  var dIds={};hitDrafts.forEach(function(c){dIds[c.id]=1;});
  claims=claims.filter(function(c){return !dIds[c.id];});
  ids.forEach(function(id){delete badFiles[id];});
  hideLoading();delSel=null;toast(ids.length+"件を削除しました");render();
}

function loadImage(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i);};i.onerror=function(){rej(new Error("image"));};i.src=src;});}
function drawScaled(img,max){var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,s=Math.min(1,max/Math.max(w,h));
  var cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(w*s));cv.height=Math.max(1,Math.round(h*s));
  var c=cv.getContext("2d");c.fillStyle="#fff";c.fillRect(0,0,cv.width,cv.height);c.drawImage(img,0,0,cv.width,cv.height);return cv;}
function toBlob(cv,q){return new Promise(function(res){cv.toBlob(function(b){res(b);},"image/jpeg",q);});}
function gray(cv){var c=cv.getContext("2d"),im=c.getImageData(0,0,cv.width,cv.height),d=im.data;
  for(var i=0;i<d.length;i+=4){var y=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000;y=(y-20)*255/215;d[i]=d[i+1]=d[i+2]=y<0?0:(y>255?255:y);}c.putImageData(im,0,0);return cv;}
async function processImage(file){
  var url=URL.createObjectURL(file);

    var blob=await toBlob(gray(drawScaled(img,1600)),0.72);
    var thumb=gray(drawScaled(img,700)).toDataURL("image/jpeg",0.65);

  }finally{URL.revokeObjectURL(url);}
}

async function checkFile(blob,type){
  if(type==="pdf"){
    if(!(await ensurePdfLib()))return "offline";
    try{
      var src=await PDFLib.PDFDocument.load(await ab(blob));
      var t=await PDFLib.PDFDocument.create();

      await t.save();

    }catch(e){return /encrypt/i.test(String(e&&(e.name+" "+e.message)))?"pw":"pdf";}
  }
  var url=URL.createObjectURL(blob);
  try{await loadImage(url);return null;}catch(e){return "img";}finally{URL.revokeObjectURL(url);}
}

/* ========================================================
   自動読み取り(すべて端末の中で処理。サーバーには送らない)
   ======================================================== */
var MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
function rdNorm(t){
  return String(t||"").replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248);})
    .replace(/[＄]/g,"$").replace(/\r/g,"").replace(/[ \t]+/g," ");
}
function rdMoneyIn(line){
  // "$29.90" "128.00" "$130." "1,234.50"  (ドル記号か小数点があるものだけ)
  var re=/([$¥￥]\s?)?(\d{1,3}(?:,\d{3})+|\d+)(\.\d{0,2})?(?!\d)(\s?円)?/g,m,out=[];
  while((m=re.exec(line))){
    var hasDollar=!!(m[1]||m[4]),dec=m[3];
    if(!hasDollar&&!(dec&&dec.length===3))continue;
    var before=line.slice(Math.max(0,m.index-1),m.index);
    if(/[\/\-:]/.test(before))continue;
    var v=parseFloat(m[2].replace(/,/g,"")+(dec&&dec.length>1?dec:""));
    if(v>0&&v<100000)out.push(v);
  }
  return out;
}
function rdAmount(text){
  var lines=rdNorm(text).split("\n");
  var keys=[/total\s*charge/i,/amount\s*paid/i,/this\s*payment/i,/total\s*paid/i,/paid\s*amount|payment\s*amount/i,
    /total\s*of\s*services/i,/grand\s*total/i,/total\s*amount/i,/(^|[^a-z])tota[l1!i|]([^a-z]|$)/i,/合計|お支払|領収金額|請求額/];
  var bad=/gst|balance|outstanding|change|rounding|discount|rebate|medicare|claim(ed)?\s*amount|owing/i;
  for(var k=0;k<keys.length;k++){
    for(var i=0;i<lines.length;i++){
      var L=lines[i];
      if(!keys[k].test(L)||bad.test(L))continue;
      var vals=rdMoneyIn(L);
      if(!vals.length&&lines[i+1])vals=rdMoneyIn(lines[i+1]);
      if(!vals.length)continue;
      // 表の見出し行("Fee  Amount paid")のように同じ行に金額が無い場合は次へ
      return vals[vals.length-1];
    }
  }
  return null;
}
function rdIso(y,m,d){
  y=+y;m=+m;d=+d;if(y<100)y+=2000;
  if(!(m>=1&&m<=12&&d>=1&&d<=31))return null;
  var dt=new Date(y,m-1,d);if(dt.getMonth()!==m-1)return null;
  return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}
function rdDate(text,todayIso){
  var lines=rdNorm(text).split("\n"),cands=[];
  var today=todayIso?new Date(todayIso+"T00:00:00"):new Date();
  var min=new Date(today);min.setDate(min.getDate()-400);
  function push(iso,line){
    if(!iso)return;var dt=new Date(iso+"T00:00:00");if(dt>today||dt<min)return;
    var score=/date|service|dispensed|treatment|visit|issued|受診|診療|日付/i.test(line)?2:0;
    if(/due|expiry|expires|birth|dob|valid|next/i.test(line))score-=3;
    cands.push({iso:iso,score:score});
  }
  lines.forEach(function(L){
    var m,re;
    re=/(\d{4})[\/.\-年](\d{1,2})[\/.\-月](\d{1,2})日?/g;while((m=re.exec(L)))push(rdIso(m[1],m[2],m[3]),L);
    re=/(^|[^\d])(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4}|\d{2})(?!\d)/g;while((m=re.exec(L)))push(rdIso(m[4],m[3],m[2]),L);
    re=/(\d{1,2})(?:st|nd|rd|th)?[\s\-]+(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?[\s\-,]+(\d{4}|\d{2})(?!\d)/gi;while((m=re.exec(L)))push(rdIso(m[3],MONTHS[m[2].toLowerCase()],m[1]),L);
    re=/(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/gi;while((m=re.exec(L)))push(rdIso(m[3],MONTHS[m[1].toLowerCase()],m[2]),L);
  });
  if(!cands.length)return null;
  var agg={};cands.forEach(function(c){var a=agg[c.iso]=agg[c.iso]||{iso:c.iso,score:0,n:0};a.score=Math.max(a.score,c.score);a.n++;});
  var list=Object.keys(agg).map(function(k){return agg[k];});
  list.sort(function(a,b){return (b.score-a.score)||(b.n-a.n)||(a.iso<b.iso?1:-1);});
  return list[0].iso;
}
function rdPerson(text,members){
  var lines=rdNorm(text).split("\n");
  var payer=/received\s*from|bill(ed)?\s*to|paid\s*by|payer|account\s*(holder|name)|invoice\s*to|policy\s*holder/i;
  var hit={};
  lines.forEach(function(L,i){
    var prev=lines[i-1]||"";
    var isPayer=payer.test(L)||(payer.test(prev)&&!/\d/.test(prev.replace(payer,"")));
    if(isPayer)return;
    members.forEach(function(m){
      var re=new RegExp("(^|[^A-Za-z])"+m.replace(/[^A-Za-z]/g,"")+"([^A-Za-z]|$)","i");
      if(re.test(L))hit[m]=1;
    });
  });
  var ks=Object.keys(hit);
  return ks.length===1?ks[0]:null;
}
function rdCategory(text){
  var t=rdNorm(text).toLowerCase();
  if(/dental|dentist|orthodont|occlusal|endodont|periodont|歯科/.test(t))return "D";
  if(/pharmacy|chemist|pbs|dispensed|prescriber|script\s*no|薬局|調剤/.test(t))return "P";
  if(/medical|clinic|doctor|\bdr\b|\bgp\b|mbs|pathology|radiology|hospital|physio|myotherap|psycholog|counsel|consult|クリニック|病院|医院|診療/.test(t))return "M";
  return null;
}
function readReceiptText(text,members,todayIso){
  return {amount:rdAmount(text),date:rdDate(text,todayIso),person:rdPerson(text,members||[]),category:rdCategory(text)};
}

async function pdfText(blob){
  var lib=await getPdfjs();

  try{var tcv=await pdfThumb(doc);rec.thumb=tcv.toDataURL("image/jpeg",0.7);}catch(te){console.warn(te);}
  var out=[];
  for(var p=1;p<=Math.min(doc.numPages,3);p++){
    var tc=await (await doc.getPage(p)).getTextContent(),rows={};
    tc.items.forEach(function(it){if(!it.str)return;var y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push(it);});
    Object.keys(rows).map(Number).sort(function(a,b){return b-a;}).forEach(function(y){
      out.push(rows[y].sort(function(a,b){return a.transform[4]-b.transform[4];}).map(function(i){return i.str;}).join(" "));});
  }
  var text=out.join("\n");
  if(text.replace(/\s/g,"").length<20){ // 文字情報のないスキャンPDFは画像にして読む
    var pg=await doc.getPage(1),vp=pg.getViewport({scale:2}),cv=document.createElement("canvas");
    cv.width=vp.width;cv.height=vp.height;
    await pg.render({canvas:cv,canvasContext:cv.getContext("2d"),viewport:vp}).promise;
    text=await ocrImage(await toBlob(cv,0.9));
  }
  return text;
}
var readSkip=null,readTimedOut=false;
function untilSkip(promise,ms){
  return new Promise(function(res){
    var done=false;function fin(v){if(done)return;done=true;readSkip=null;res(v);}
    readTimedOut=false;readSkip=function(){fin(null);};setTimeout(function(){if(!done)readTimedOut=true;fin(null);},ms);
    promise.then(fin,function(e){console.warn(e);fin(null);});
  });
}

async function assemblePdf(sel,cm,imgMax,imgQ){
  var failures=[];
  var doc=await PDFLib.PDFDocument.create(),W=595.28,H=841.89,M=24,c=normCur(cm.currency);
  var fc=await formCanvas(sel,cm),fi=await doc.embedJpg(fc.toDataURL("image/jpeg",0.92));

  else{var s=(H-M*2)/dh;pg.drawImage(fi,{x:(W-dw*s)/2,y:M,width:dw*s,height:H-M*2});}
  for(var i=0;i<sel.length;i++){var r=sel[i];
    $("loadingText").textContent="レシートをまとめています（"+(i+1)+"/"+sel.length+"）";
    try{
      if(r.fileType==="pdf"){
        var src;
        try{src=await PDFLib.PDFDocument.load(await ab(r.blob));}
        catch(le){if(/encrypt/i.test(String(le&&(le.name+" "+le.message)))){var pe=new Error("encrypted");pe.kind="pw";throw pe;}throw le;}
        (await doc.copyPages(src,src.getPageIndices())).forEach(function(p){doc.addPage(p);});
      }else{
        var img=await doc.embedJpg(await recompress(r.blob,imgMax,imgQ)),page=doc.addPage([W,H]);
        var k=Math.min((W-M*2)/img.width,(H-M*2-24)/img.height),w=img.width*k,hh=img.height*k;
        page.drawImage(img,{x:(W-w)/2,y:H-M-24-hh,width:w,height:hh});

      }
    }catch(e){console.error(e);failures.push({id:r.id,kind:(e&&e.kind)||(r.fileType==="pdf"?"pdf":"img")});}
  }
  if(failures.length)return {failures:failures};
  return {bytes:await doc.save(),failures:[]};
}

    case "setCat": rec.category=d.v;if(rec.auto)delete rec.auto.category;nextAfter("recWhat");break;
    case "setCondChip": rec.condition=d.v;nextAfter("recCond");break;
    case "condForget":
      profile.condHistory=condHist().filter(function(x){return x.t!==d.v;});saveProfile();
      var keep=$("inCond")?$("inCond").value:"";render();if(keep&&$("inCond"))$("inCond").value=keep;break;
    case "condNext":
      var cv=($("inCond").value||"").trim();
      if(!cv){$("fCond").classList.add("bad");$("inCond").focus();break;}
      rec.condition=cv;nextAfter("recCond");break;
    case "amtNext":
      var v=parseAmt($("inAmt").value,cur());
      if(!(v>0)){$("fAmt").classList.add("bad");$("amtErr").hidden=false;$("inAmt").focus();break;}
      if(rec.auto&&String(v)!==String(rec.amount))delete rec.auto.amount;rec.amount=String(v);nextAfter("recAmt");break;
    case "useDate":
      if(!pickedDate)break;
      if(rec.auto&&pickedDate!==rec.date)delete rec.auto.date;
      rec.date=pickedDate;pickedDate="";calMonth="";nextAfter("recDate");break;
    case "calPick": pickedDate=d.v;refreshCal();break;
    case "calMove": calMonth=addMonth(calMonth,Number(d.v));refreshCal();break;
    case "editStep": pickedDate="";calMonth="";rec.fromCheck=true;go(d.step);break;
    case "saveRec": saveRec();break;
    case "cancelRec": if(confirm("このレシートの記録をやめますか？")){rec=null;home();}break;
    case "delRec":
      var inD=draftsWith(rec.id).length;
      if(!confirm("このレシートを削除しますか？"+(inD?"\n\n※途中の申請書に入っているため、その申請書も削除されます。":"")))break;
      dropDraftsWith(rec.id).then(function(){return dbDel("receipts",rec.id);}).then(function(){receipts=receipts.filter(function(x){return x.id!==rec.id;});rec=null;toast("削除しました");stack=[{name:"home"}];cur_screen={name:"list"};render();});break;
    case "viewImg":
      if(!rec||!rec.blob)break;
      openViewer(rec.blob,rec.fileType);break;

    case "list": delSel=null;go("list");break;
    case "delStart": delSel={};render();break;
    case "delCancel": delSel=null;render();break;
    case "delToggle": delSel[d.id]=!delSel[d.id];var sy=window.scrollY;render();window.scrollTo(0,sy);break;
    case "delPick":
      var v=d.v,sy2=window.scrollY;
      if(v==="none")delSel={};
      else receipts.forEach(function(r){
        if(v==="all"||(v==="done"&&r.claimedAt)||(v.indexOf("m:")===0&&monthKey(r.date)===v.slice(2)))delSel[r.id]=true;});
      render();window.scrollTo(0,sy2);break;
    case "delRun": deleteSelected();break;
    case "cleanup":
      delSel={};receipts.forEach(function(r){if(r.claimedAt)delSel[r.id]=true;});
      go("list");break;
    case "openRec":
      var r=receipts.find(function(x){return x.id===d.id;});if(!r)break;
      rec={mode:"edit",id:r.id,person:r.person,category:r.category,condition:r.condition||"",amount:r.amount,date:r.date,
        blob:r.blob,thumb:r.thumb,fileType:r.fileType,fileName:r.fileName,claimedAt:r.claimedAt};
      go("recCheck");break;

    case "claim":
      claimFilter={month:"all",person:"all"};resetClaimSel();
      go("claimPick");break;
    case "filt":
      claimFilter[d.k]=d.v;resetClaimSel();render();break;
    case "toggleSel":
      var n=Object.keys(claimSel).filter(function(k){return claimSel[k];}).length;
      if(!claimSel[d.id]&&n>=CLAIM_ROW_MAX){toast("1回で申請できるのは"+CLAIM_ROW_MAX+"件までです");break;}
      claimSel[d.id]=!claimSel[d.id];var y=window.scrollY;render();window.scrollTo(0,y);break;
    case "makePdf": makePdf();break;
    case "dropFailed":
      claimFails.forEach(function(f){claimSel[f.id]=false;});claimFails=[];
      if(!claimPool().some(function(r){return claimSel[r.id];})){toast("申請書に入れるレシートがありません");back();break;}
      cur_screen=stack.pop()||{name:"claimPick"};makePdf();break;
    case "replaceFile": rec.replacing=true;$("filePhoto").click();break;
    case "resume": go("claimSend",d.id);break;
    case "claimOk":
      (async function(){var co=claims.find(function(x){return x.id===d.id;});if(!co||!co.pdfBlob){toast("PDFが見つかりません");return;}
        if(await savePdf(co))go("claimSaved",d.id);})();break;
    case "savedMail": finishClaim(d.id,"mailto");break;
    case "savedEnd": finishClaim(d.id,"saved");break;
    case "claimFix": go("claimFix",d.id);break;
    case "fixRec": case "fixProfile": case "fixPick":
      (async function(){
        await dbDel("claims",d.id);claims=claims.filter(function(x){return x.id!==d.id;});
        stack=[{name:"home"}];
        if(a==="fixRec"){fixHint="rec";delSel=null;cur_screen={name:"list"};render();}
        else if(a==="fixProfile"){fixHint="profile";cur_screen={name:"settings"};render();}
        else{fixHint=null;cur_screen={name:"claimPick"};render();}
      })();break;
    case "viewClaim": (function(){var c=claims.find(function(x){return x.id===d.id;});if(c&&c.pdfBlob)openViewer(c.pdfBlob,"pdf");})();break;
    case "drafts": go("drafts");break;
    case "discardAll": discardAll();break;
    case "previewPdf":
      var c1=claims.find(function(x){return x.id===d.id;});if(!c1)break;
      openViewer(c1.pdfBlob,"pdf");break;
    case "copy": copy(d.v);break;
    case "savePdf":
      var c2=claims.find(function(x){return x.id===d.id;});if(!c2||!c2.pdfBlob){toast("PDFが見つかりません");break;}
      savePdf(c2);break;
    case "discard": discard(d.id);break;
  }
}
function mailBody(){return["Dear Claims Team,","","Please find the attached documents for my insurance claim.","","Policyholder: "+(profile.name||"-"),"Policy Number: "+(profile.policyNo||"-"),"","Please let me know if you need any further information.","","Best regards,",profile.name||"-"].join("\n");}
function titleCase(n){return String(n||"").toLowerCase().replace(/(^|[\s\-])([a-z])/g,function(m,a,b){return a+b.toUpperCase();});}
// 件名の例: "Medical Claim Form - Ryoma Hama Nov 2026" / 複数月なら "Oct-Nov 2026"
function mailSubject(c){
  var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var ks=[];
  ((c&&c.receiptIds)||[]).forEach(function(id){var r=receipts.find(function(x){return x.id===id;});if(r){var k=monthKey(r.date);if(ks.indexOf(k)<0)ks.push(k);}});
  ks.sort();
  var lab;
  if(!ks.length){var d=new Date();lab=MON[d.getMonth()]+" "+d.getFullYear();}
  else{
    var f=ks[0].split("-"),l=ks[ks.length-1].split("-");
    if(ks.length===1)lab=MON[+f[1]-1]+" "+f[0];
    else if(f[0]===l[0])lab=MON[+f[1]-1]+"-"+MON[+l[1]-1]+" "+f[0];
    else lab=MON[+f[1]-1]+" "+f[0]+"-"+MON[+l[1]-1]+" "+l[0];
  }
  return "Medical Claim Form - "+titleCase(profile.name)+" "+lab;
}
// 保存またはメール下書き → 「申請書作成済み」にして終了
function canShareFile(file){return !!(isMobile()&&file&&navigator.canShare&&navigator.canShare({files:[file]}));}
var lastFinished=null; // 完了画面で件名を表示するため
async function finishClaim(id,how){
  var c=claims.find(function(x){return x.id===id;});if(!c||!c.pdfBlob){toast("PDFが見つかりません");return;}
  var ok=false;
  if(how==="saved"){
    ok=true; // OKを押したときに保存済み
  }else if(how==="save"){
    ok=await savePdf(c);
  }else if(how==="mailto"){
    // iPhone: ファイルは保存済み。宛先・件名・本文入りのメールを開く
    location.href="mailto:"+encodeURIComponent(insurerEmail())+"?subject="+encodeURIComponent(mailSubject(c))+"&body="+encodeURIComponent(mailBody());
    ok=true;
  }else{
    var file=null;try{file=new File([c.pdfBlob],c.filename,{type:"application/pdf"});}catch(e){}
    if(canShareFile(file)){
      // 説明画面(mailPrep)で「メールを開く」を押したときにここへ来る
      try{if(navigator.clipboard&&navigator.clipboard.writeText)await navigator.clipboard.writeText(insurerEmail());}catch(e){}
      try{await navigator.share({files:[file],title:mailSubject(c),text:mailBody()});ok=true;}
      catch(e){if(e&&e.name==="AbortError")return;ok=false;}
    }
    if(!ok){
      // パソコンなど: PDFを保存して、宛先・件名・本文入りのメールを開く(添付は手動)
      await savePdf(c,true);
      location.href="mailto:"+encodeURIComponent(insurerEmail())+"?subject="+encodeURIComponent(mailSubject(c))+"&body="+encodeURIComponent(mailBody());
      ok=true;
    }
  }
  if(!ok)return;
  var now=new Date().toISOString();
  for(var i=0;i<receipts.length;i++){if(c.receiptIds.indexOf(receipts[i].id)>=0){receipts[i].claimedAt=now;receipts[i].claimId=c.id;await dbPut("receipts",receipts[i]);}}
  await dbDel("claims",c.id);claims=claims.filter(function(x){return x.id!==c.id;});
  lastFinished={subject:mailSubject(c)};
  stack=[];cur_screen={name:"claimDone",arg:{how:how,mobile:isMobile()}};render();
}
async function discard(id){
  if(!confirm("この申請書を削除しますか？\n（レシートは消えずに「申請書がまだ」の状態に戻ります）"))return;
  await dbDel("claims",id);claims=claims.filter(function(x){return x.id!==id;});
  toast("申請書を削除しました");
  if(drafts().length>1){stack=[{name:"home"}];cur_screen={name:"drafts"};render();}else home();
}
async function discardAll(){
  var ds=drafts();if(!ds.length)return;
  if(!confirm("途中の申請書"+ds.length+"件をすべて削除しますか？\n（レシートは消えずに「申請書がまだ」の状態に戻ります）"))return;
  for(var i=0;i<ds.length;i++)await dbDel("claims",ds[i].id);
  claims=claims.filter(function(c){return c.status!=="draft";});
  toast("途中の申請書を削除しました");home();
}


/* ---------- PDFをページ内に表示 ---------- */
async function renderPdfInto(box,blob,maxPages){
  if(!box)return;
  try{
    var lib=await getPdfjs();
    var doc=await lib.getDocument({data:new Uint8Array(await ab(blob))}).promise;
    box.innerHTML="";
    var w=Math.max(200,box.clientWidth-2),ratio=window.devicePixelRatio||1;
    for(var p=1;p<=Math.min(doc.numPages,maxPages||20);p++){
      if(!document.body.contains(box))return; // 画面を移動したら中止
      var pg=await doc.getPage(p),vp0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:w/vp0.width*ratio});
      var cv=document.createElement("canvas");cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);cv.style.width=w+"px";
      box.appendChild(cv);
      await pg.render({canvas:cv,canvasContext:cv.getContext("2d"),viewport:vp}).promise;
    }
  }catch(e){
    console.warn(e);
    box.innerHTML="";var u=URL.createObjectURL(blob);viewerUrls.push(u);
    var fr=document.createElement("iframe");fr.src=u;fr.title="申請書";fr.style.cssText="width:100%;height:70vh;border:0;background:#fff";box.appendChild(fr);
  }
}
/* ---------- アプリ内ビューア(別ページを開かない) ---------- */
var viewerUrls=[];
function openViewer(blob,type){
  var body=$("viewerBody");body.innerHTML="";$("viewer").hidden=false;document.body.style.overflow="hidden";
  if(type!=="pdf"){var u=URL.createObjectURL(blob);viewerUrls.push(u);var im=document.createElement("img");im.src=u;body.appendChild(im);return;}
  body.innerHTML='<div class="vmsg">PDFを表示しています…</div>';
  (async function(){
    try{
      var lib=await getPdfjs();
      var doc=await lib.getDocument({data:new Uint8Array(await ab(blob))}).promise;
      body.innerHTML="";
      var w=Math.min(window.innerWidth-16,900),ratio=window.devicePixelRatio||1;
      for(var p=1;p<=Math.min(doc.numPages,30);p++){
        if($("viewer").hidden)return;
        var pg=await doc.getPage(p),vp0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:w/vp0.width*ratio});
        var cv=document.createElement("canvas");cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);cv.style.width=w+"px";
        body.appendChild(cv);
        await pg.render({canvas:cv,canvasContext:cv.getContext("2d"),viewport:vp}).promise;
      }
    }catch(e){
      console.warn(e);
      // 表示できないときは、ブラウザ標準の表示に切り替え(この画面の中で)
      body.innerHTML="";var u=URL.createObjectURL(blob);viewerUrls.push(u);
      var fr=document.createElement("iframe");fr.src=u;fr.title="PDF";body.appendChild(fr);
    }
  })();
}
function closeViewer(){
  $("viewer").hidden=true;$("viewerBody").innerHTML="";document.body.style.overflow="";
  viewerUrls.forEach(function(u){URL.revokeObjectURL(u);});viewerUrls=[];
}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");
  if(!el||el.disabled)return;
  act(el.getAttribute("data-act"),el);
});
$("fileCam").addEventListener("change",function(){var f=this.files&&this.files[0];this.value="";onFile(f);});
$("filePhoto").addEventListener("change",function(){var f=this.files&&this.files[0];this.value="";onFile(f);});
$("filePdf").addEventListener("change",function(){var f=this.files&&this.files[0];this.value="";onFile(f,"pdf");});
$("loadingSkip").addEventListener("click",function(){if(readSkip)readSkip();});
$("viewerClose").addEventListener("click",closeViewer);

(async function init(){
  try{receipts=await dbAll("receipts");claims=await dbAll("claims");
    // 作成済みの申請書PDFは容量を使うので削除(レシートの「申請書作成済み」はそのまま)
    var done=claims.filter(function(c){return c.status!=="draft";});
    for(var k=0;k<done.length;k++)await dbDel("claims",done[k].id);
    claims=claims.filter(function(c){return c.status==="draft";});
  }catch(e){console.error(e);toast("データを読み込めませんでした");}
  seedCondHistory();
  home();
  setTimeout(scanStored,300);
  if(navigator.storage&&navigator.storage.persist){try{navigator.storage.persist();}catch(e){}}
})();
})();
